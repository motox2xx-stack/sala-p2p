<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P — Sala com Senha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f1f5f9;
        }

        .caixa {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 28px;
            font-size: 1.4rem;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .grupo-input {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            line-height: 1.5;
        }

        .status.aguardando {
            background: rgba(217, 119, 6, 0.2);
            border: 1px solid rgba(217, 119, 6, 0.4);
            color: #fcd34d;
        }

        .status.conectado {
            background: rgba(22, 163, 74, 0.2);
            border: 1px solid rgba(22, 163, 74, 0.4);
            color: #86efac;
        }

        .status.erro {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.4);
            color: #fca5a5;
        }

        .status.info {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
        }

        .escondido {
            display: none !important;
        }

        .chat {
            display: flex;
            flex-direction: column;
            height: 550px;
        }

        .cabeçalho-chat {
            text-align: center;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid #334155;
        }

        .caixa-mensagens {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: #0f172a;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .msg {
            margin-bottom: 10px;
            padding: 10px 14px;
            border-radius: 18px;
            max-width: 85%;
            line-height: 1.4;
            font-size: 0.95rem;
        }

        .msg.eu {
            background: #2563eb;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 6px;
        }

        .msg.outro {
            background: #334155;
            color: #f1f5f9;
            margin-right: auto;
            border-bottom-left-radius: 6px;
        }

        .msg.sistema {
            background: #1e293b;
            color: #94a3b8;
            font-size: 0.85rem;
            text-align: center;
            max-width: 100%;
            padding: 6px 10px;
        }

        .msg.imagem {
            max-width: 90%;
            width: fit-content;
            padding: 8px;
            border-radius: 12px;
        }

        .msg.imagem.eu {
            margin-left: auto;
        }

        .msg.imagem.outro {
            margin-right: auto;
        }

        .msg.imagem img {
            display: block;
            max-width: 100%;
            max-height: 320px;
            border-radius: 8px;
            object-fit: contain;
        }

        .msg.imagem small {
            display: block;
            margin-top: 6px;
            color: #cbd5e1;
            overflow-wrap: anywhere;
        }

        .linha {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
        }

        .linha button {
            flex: 0 0 auto;
            width: auto;
            padding: 8px 14px;
            font-size: 0.85rem;
        }

        .entrada-mensagem {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="caixa">
        <!-- TELA DE ENTRADA -->
        <div id="telaEntrada">
            <h1>💬 P2P com Supabase</h1>
            <div class="grupo-input">
                <label for="nomeSala">Nome da Sala</label>
                <input type="text" id="nomeSala" placeholder="Ex: sala-secreta-123">
            </div>
            <div class="grupo-input">
                <label for="senhaSala">Senha da Sala</label>
                <input type="password" id="senhaSala" placeholder="Senha segura">
            </div>
            <button id="btnConectar">Conectar</button>
            <div id="statusConexao" class="status escondido"></div>
        </div>

        <!-- TELA DE CHAT -->
        <div id="telaChat" class="chat escondido">
            <div class="cabeçalho-chat">
                <h2>Sala: <span id="nomeSalaExibida"></span></h2>
            </div>
            <div id="caixaMensagens" class="caixa-mensagens"></div>
            
            <div id="progressoFoto" class="status escondido" style="margin-bottom: 8px; margin-top: 0;"></div>

            <div class="linha">
                <input type="file" id="arquivoFotoInput" accept="image/*" class="escondido">
                <button onclick="document.getElementById('arquivoFotoInput').click()">📷 Enviar Foto</button>
            </div>

            <div class="entrada-mensagem">
                <input type="text" id="mensagemInput" placeholder="Digite sua mensagem...">
                <button id="enviarBtn" style="width: auto; padding: 12px 18px;">Enviar</button>
            </div>
        </div>
    </div>

    <!-- Script do Supabase (Client JS) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // CONFIGURAÇÃO DO SUPABASE (Insira as suas credenciais aqui)
        const SUPABASE_URL = "SUA_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "SUA_SUPABASE_ANON_KEY";

        let supabase = null;
        let nomeSala = "";
        let senhaHash = "";
        let pc = null;
        let canal = null;
        let ehIniciador = false;
        let inscricaoRealtime = null;

        const PROTOCOLO_FOTO = "PROTOCOLO_FOTO_V1:";
        const LIMITE_FOTO = 15 * 1024 * 1024; // 15MB
        const TAMANHO_BLOCO = 16 * 1024;      // 16KB por bloco
        let enviandoFoto = false;
        let arquivoRecebido = null;

        // Elementos da UI
        const telaEntrada = document.getElementById("telaEntrada");
        const telaChat = document.getElementById("telaChat");
        const nomeSalaInput = document.getElementById("nomeSala");
        const senhaSalaInput = document.getElementById("senhaSala");
        const btnConectar = document.getElementById("btnConectar");
        const statusConexao = document.getElementById("statusConexao");
        const caixaMensagens = document.getElementById("caixaMensagens");
        const mensagemInput = document.getElementById("mensagemInput");
        const enviarBtn = document.getElementById("enviarBtn");
        const arquivoFotoInput = document.getElementById("arquivoFotoInput");
        const progressoFoto = document.getElementById("progressoFoto");

        function mostrarStatus(texto, classe) {
            statusConexao.textContent = texto;
            statusConexao.className = "status " + classe;
        }

        function addMsg(tipo, texto) {
            const div = document.createElement("div");
            div.className = `msg ${tipo}`;
            div.textContent = texto;
            caixaMensagens.appendChild(div);
            caixaMensagens.scrollTop = caixaMensagens.scrollHeight;
        }

        function adicionarImagem(tipo, url, nome) {
            const div = document.createElement("div");
            div.className = `msg imagem ${tipo}`;
            div.innerHTML = `<img src="${url}" alt="${nome}"><small>${nome}</small>`;
            caixaMensagens.appendChild(div);
            caixaMensagens.scrollTop = caixaMensagens.scrollHeight;
        }

        async function hashSenha(senha) {
            const msgUint8 = new TextEncoder().encode(senha);
            const hashBuffer = await crypto.subtle.digest("SHA-256", msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        }

        async function inicializarSupabase() {
            if (supabase) return true;
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                return true;
            } catch (e) {
                mostrarStatus("Erro ao iniciar Supabase: " + e.message, "erro");
                return false;
            }
        }

        async function enviarSinal(conteudo) {
            if (!supabase || !nomeSala) return;
            const hash = await senhaHash;
            await supabase.from("sinalizacao").insert({
                sala: nomeSala,
                senha_hash: hash,
                conteudo: conteudo,
                criado_em: new Date().toISOString()
            });
        }

        async function adicionarCandidatoSeguro(candidato) {
            try {
                if (pc && pc.remoteDescription) {
                    await pc.addIceCandidate(new RTCIceCandidate(candidato));
                }
            } catch (e) {
                console.warn("Erro ao adicionar candidato ICE:", e);
            }
        }

        async function processarCandidatosPendentes() {
            // Lógica para tratar fila se necessário
        }

        async function processarSinalRecebido(conteudo) {
            if (!pc) await iniciarConexaoP2P();
            try {
                if (conteudo.tipo === "offer") {
                    if (!pc.remoteDescription && !ehIniciador) {
                        await pc.setRemoteDescription(new RTCSessionDescription(conteudo.dados));
                        await processarCandidatosPendentes();
                        
                        const resposta = await pc.createAnswer();
                        await pc.setLocalDescription(resposta);
                        
                        await enviarSinal({
                            tipo: "answer",
                            dados: pc.localDescription
                        });
                        
                        mostrarStatus("🟢 Resposta enviada! Conectando...", "aguardando");
                    }
                } else if (conteudo.tipo === "answer") {
                    if (!pc.remoteDescription) {
                        await pc.setRemoteDescription(new RTCSessionDescription(conteudo.dados));
                        await processarCandidatosPendentes();
                    }
                } else if (conteudo.tipo === "candidate" && conteudo.dados?.candidate) {
                    await adicionarCandidatoSeguro(conteudo.dados.candidate);
                }
            } catch (erro) {
                mostrarStatus("⚠️ Erro no sinal: " + erro.message, "erro");
                console.error("Erro WebRTC:", erro);
            }
        }

        async function limparSinaisAntigos() {
            if (!supabase || !nomeSala) return;
            try {
                const umMinutoAtras = new Date(Date.now() - 60 * 1000).toISOString();
                await supabase
                    .from("sinalizacao")
                    .delete()
                    .eq("sala", nomeSala)
                    .lt("criado_em", umMinutoAtras);
            } catch (e) {
                console.warn("Não foi possível limpar sinais antigos:", e);
            }
        }

        async function iniciarConexaoP2P() {
            if (pc) return;

            pc = new RTCPeerConnection({
                iceServers: [
                    { urls: "stun:stun.l.google.com:19302" }
                ]
            });

            if (ehIniciador) {
                canal = pc.createDataChannel('chat');
                configurarCanal();
            } else {
                pc.ondatachannel = (evento) => {
                    canal = evento.channel;
                    configurarCanal();
                };
            }

            pc.onicecandidate = async (evento) => {
                if (!evento.candidate) return;
                await enviarSinal({
                    tipo: "candidate",
                    dados: { candidate: evento.candidate.toJSON() }
                });
            };

            pc.onconnectionstatechange = () => {
                console.log("Estado da conexão:", pc.connectionState);
                if (pc.connectionState === "connected") {
                    mostrarStatus("✅ Conectado com sucesso!", "conectado");
                } else if (pc.connectionState === "disconnected") {
                    addMsg("sistema", "⚠️ Conexão perdida.");
                } else if (pc.connectionState === "failed") {
                    mostrarStatus("❌ Conexão falhou. Tente novamente.", "erro");
                }
            };
        }

        function configurarCanal() {
            canal.binaryType = "arraybuffer";
            canal.bufferedAmountLowThreshold = 256 * 1024;

            canal.onopen = () => {
                telaEntrada.classList.add("escondido");
                telaChat.classList.remove("escondido");
                document.getElementById("nomeSalaExibida").textContent = nomeSala;
                addMsg("sistema", "✅ Conexão P2P estabelecida!");
            };

            canal.onmessage = (evento) => {
                processarMensagemRecebida(evento.data);
            };

            canal.onclose = () => {
                addMsg("sistema", "⚠️ Conexão encerrada.");
            };

            canal.onerror = (erro) => {
                console.error("Erro no canal:", erro);
            };
        }

        function enviarControle(dados) {
            canal.send(PROTOCOLO_FOTO + JSON.stringify(dados));
        }

        function aguardarBuffer() {
            if (canal.bufferedAmount <= 256 * 1024) {
                return Promise.resolve();
            }
            return new Promise((resolve, reject) => {
                const timeout = setTimeout(() => {
                    canal.removeEventListener("bufferedamountlow", liberar);
                    reject(new Error("Tempo limite de envio."));
                }, 30000);
                function liberar() {
                    clearTimeout(timeout);
                    resolve();
                }
                canal.addEventListener("bufferedamountlow", liberar, { once: true });
            });
        }

        arquivoFotoInput.addEventListener("change", async function () {
            const arquivo = this.files[0];
            this.value = "";

            if (!arquivo) return;
            if (!arquivo.type.startsWith("image/")) {
                alert("Selecione uma imagem válida.");
                return;
            }
            if (arquivo.size > LIMITE_FOTO) {
                alert("Imagem muito grande! Máximo 15MB.");
                return;
            }
            if (!canal || canal.readyState !== "open") {
                alert("Você precisa estar conectado para enviar arquivos.");
                return;
            }
            if (enviandoFoto) {
                alert("Aguarde o envio terminar.");
                return;
            }

            enviandoFoto = true;
            progressoFoto.classList.remove("escondido");
            progressoFoto.className = "status aguardando";
            progressoFoto.textContent = "Preparando imagem...";

            try {
                const id = crypto.randomUUID();
                const urlLocal = URL.createObjectURL(arquivo);
                adicionarImagem("eu", urlLocal, arquivo.name);

                enviarControle({
                    tipo: "inicio",
                    id,
                    nome: arquivo.name,
                    mime: arquivo.type,
                    tamanho: arquivo.size
                });

                let enviados = 0;
                while (enviados < arquivo.size) {
                    await aguardarBuffer();
                    if (canal.readyState !== "open") {
                        throw new Error("Conexão interrompida.");
                    }
                    const fim = Math.min(enviados + TAMANHO_BLOCO, arquivo.size);
                    const bloco = await arquivo.slice(enviados, fim).arrayBuffer();
                    canal.send(bloco);
                    enviados = fim;
                    const porcentagem = Math.floor((enviados / arquivo.size) * 100);
                    progressoFoto.textContent = `Enviando foto: ${porcentagem}%`;
                }

                enviarControle({ tipo: "fim", id });
                progressoFoto.className = "status conectado";
                progressoFoto.textContent = "✅ Foto enviada!";
                setTimeout(() => progressoFoto.classList.add("escondido"), 3000);
            } catch (erro) {
                progressoFoto.className = "status erro";
                progressoFoto.textContent = "❌ " + erro.message;
                console.error(erro);
            } finally {
                enviandoFoto = false;
            }
        });

        function processarMensagemRecebida(dados) {
            if (dados instanceof ArrayBuffer) {
                if (!arquivoRecebido) return;
                arquivoRecebido.partes.push(dados);
                arquivoRecebido.recebido += dados.byteLength;
                const porcentagem = Math.floor((arquivoRecebido.recebido / arquivoRecebido.tamanho) * 100);
                addMsg("sistema", `📥 Recebendo: ${porcentagem}%`);
                return;
            }

            if (dados instanceof Blob) {
                dados.arrayBuffer().then(processarMensagemRecebida);
                return;
            }

            if (typeof dados !== "string") return;

            if (!dados.startsWith(PROTOCOLO_FOTO)) {
                addMsg("outro", dados);
                return;
            }

            let comando;
            try {
                comando = JSON.parse(dados.substring(PROTOCOLO_FOTO.length));
            } catch {
                return;
            }

            if (comando.tipo === "inicio") {
                if (!Number.isSafeInteger(comando.tamanho) || comando.tamanho <= 0 || 
                    comando.tamanho > LIMITE_FOTO || !comando.mime?.startsWith("image/")) {
                    arquivoRecebido = null;
                    addMsg("outro", "⚠️ Imagem inválida.");
                    return;
                }
                arquivoRecebido = {
                    id: comando.id,
                    nome: comando.nome,
                    mime: comando.mime,
                    tamanho: comando.tamanho,
                    recebido: 0,
                    partes: []
                };
                addMsg("outro", "📥 Recebendo: " + comando.nome);
            }

            if (comando.tipo === "fim") {
                if (!arquivoRecebido || arquivoRecebido.id !== comando.id) return;
                const arquivo = arquivoRecebido;
                arquivoRecebido = null;

                if (arquivo.recebido !== arquivo.tamanho) {
                    addMsg("outro", "⚠️ Arquivo incompleto.");
                    return;
                }

                const blob = new Blob(arquivo.partes, { type: arquivo.mime });
                const url = URL.createObjectURL(blob);
                adicionarImagem("outro", url, arquivo.nome);
                addMsg("sistema", "✅ Imagem recebida!");
            }
        }

        async function verificarSala() {
            mostrarStatus("🔍 Procurando parceiro na sala...", "aguardando");
            
            await limparSinaisAntigos();

            const { data: existemSinais } = await supabase
                .from("sinalizacao")
                .select("id")
                .eq("sala", nomeSala)
                .limit(1);

            ehIniciador = !existemSinais || existemSinais.length === 0;

            if (ehIniciador) {
                mostrarStatus("📡 Você é o primeiro — aguardando o outro lado...", "aguardando");
                await iniciarConexaoP2P();
                
                const oferta = await pc.createOffer();
                await pc.setLocalDescription(oferta);
                
                await enviarSinal({
                    tipo: "offer",
                    dados: pc.localDescription
                });
                
                mostrarStatus("🟡 Oferta publicada! Aguardando o Lado B...", "aguardando");
            } else {
                mostrarStatus("🔄 Encontrando oferta existente...", "aguardando");
            }
        }

        btnConectar.addEventListener("click", async () => {
            nomeSala = nomeSalaInput.value.trim();
            const senha = senhaSalaInput.value;

            if (!nomeSala || !senha) {
                mostrarStatus("⚠️ Preencha nome da sala e senha!", "erro");
                return;
            }

            btnConectar.disabled = true;
            btnConectar.textContent = "Conectando...";
            mostrarStatus("🔌 Conectando ao servidor de sinalização...", "info");

            senhaHash = hashSenha(senha);

            const ok = await inicializarSupabase();
            if (!ok) {
                btnConectar.disabled = false;
                btnConectar.textContent = "Conectar";
                return;
            }

            inscricaoRealtime = supabase
                .channel(`sala:${nomeSala}`)
                .on(
                    "postgres_changes",
                    {
                        event: "INSERT",
                        schema: "public",
                        table: "sinalizacao",
                        filter: `sala=eq.${nomeSala}`
                    },
                    (payload) => {
                        processarSinalRecebido(payload.new.conteudo);
                    }
                )
                .subscribe();

            await verificarSala();
        });

        function enviarMensagem() {
            const texto = mensagemInput.value.trim();
            if (!texto || !canal || canal.readyState !== "open") return;
            
            canal.send(texto);
            addMsg("eu", texto);
            mensagemInput.value = "";
        }

        enviarBtn.addEventListener("click", enviarMensagem);
        mensagemInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") enviarMensagem();
        });
    </script>
</body>
</html>
