<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian Shield — Centro de Controle P2P</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #0f172a; min-height: 100vh; overflow: hidden; color: white; }

        /* ========== 📞 TELA DE CHAMADA ENTRANTE ========== */
        .tela-chamada-entrante {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(24px);
            border-radius: 20px;
            padding: 32px 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10000;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .tela-chamada-entrante.ativa {
            opacity: 1;
            visibility: visible;
        }

        .tela-chamada-entrante.aceitando {
            transform: translate(-50%, -50%) scale(0.35) translate(280px, 180px);
            opacity: 0;
            pointer-events: none;
        }

        .chamada-icone {
            font-size: 48px;
            margin-bottom: 16px;
            animation: chamarPulsar 1.5s ease-in-out infinite;
        }

        @keyframes chamarPulsar {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.7; }
        }

        .chamada-titulo {
            color: white;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .chamada-quem {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .chamada-botoes {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .btn-aceitar {
            background: #22c55e;
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-aceitar:hover {
            background: #16a34a;
            transform: scale(1.05);
        }

        .btn-recusar {
            background: #ef4444;
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-recusar:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        /* ========== 📺 TELA CHEIA — LIVE/CÂMERA ========== */
        .tela-live-cheia {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease;
        }

        .tela-live-cheia.ativa {
            opacity: 1;
            visibility: visible;
        }

        .live-conteudo {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .live-imagem {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .btn-fechar-live {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .btn-fechar-live:hover {
            background: rgba(239, 68, 68, 0.6);
        }

        /* ========== 📱 MENU DESLIZANTE DURANTE LIVE ========== */
        .menu-live-deslizante {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: auto;
            max-height: 380px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
            z-index: 9500;
            transform: translateY(-100%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 16px 20px;
        }

        .menu-live-deslizante.visivel {
            transform: translateY(0);
        }

        .menu-live-conteudo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .item-menu-live {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .item-menu-live:hover {
            background: rgba(255,255,255,0.08);
        }

        /* ========== 🟢 JANELA FLUTUANTE — PRINCIPAL & ARRASTÁVEL ========== */
        .janela-flutuante {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease 0.2s;
            pointer-events: none;
        }

        .janela-flutuante.visivel {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .janela-flutuante.travada {
            user-select: none;
        }

        .cabecalho-arrastavel {
            cursor: move;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .janela-flutuante.travada .cabecalho-arrastavel {
            cursor: default;
        }

        .titulo-app {
            font-size: 0.65rem;
            color: #475569;
            margin-bottom: 6px;
            align-self: flex-end;
            padding-right: 4px;
        }

        .botao-perfil {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            color: white;
            cursor: pointer;
            opacity: 0.9;
            transition: all 0.25s ease;
            position: relative;
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
        }

        .botao-perfil:hover { 
            opacity: 1; 
            transform: scale(1.08);
        }

        .botao-perfil.online {
            border-color: #4ade80;
        }

        .botao-perfil.online::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            animation: brilhaVerde 2s ease-in-out infinite;
        }

        @keyframes brilhaVerde {
            0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(74, 222, 128, 0), 0 0 20px rgba(74, 222, 128, 0.2); }
        }

        .anel-notificacao {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: transparent;
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            transition: all 0.3s;
        }

        .anel-notificacao.piscando {
            animation: notifVermelha 0.5s ease-in-out 3;
        }

        @keyframes notifVermelha {
            0%, 100% { 
                background: #ef4444; 
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            }
            50% { 
                background: #fca5a5; 
                box-shadow: 0 0 0 6px rgba(239, 68, 68, 0), 0 0 15px rgba(239, 68, 68, 0.3);
            }
        }

        .menu-controles {
            position: absolute;
            bottom: 66px;
            right: 0;
            width: 320px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.08);
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px) scale(0.96);
            transform-origin: bottom right;
            transition: all 0.25s ease;
            pointer-events: none;
        }

        .janela-flutuante.aberto .menu-controles {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .botao-fechar {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.05);
            border: none;
            color: #94a3b8;
            font-size: 14px;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .botao-fechar:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        /* ========== 📞 FOTOS NA CHAMADA VOIP ========== */
        .area-chamada-fotos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 14px;
            padding: 10px 0;
        }

        .foto-chamada {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            opacity: 0.4;
            filter: grayscale(40%);
        }

        .foto-chamada.falando {
            opacity: 1;
            filter: grayscale(0%);
            transform: scale(1.08);
        }

        .foto-chamada-img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .foto-chamada.falando .foto-chamada-img {
            border-color: #4ade80;
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.3);
        }

        .foto-chamada-nome {
            font-size: 0.7rem;
            color: #94a3b8;
        }

        .foto-chamada.falando .foto-chamada-nome {
            color: #e2e8f0;
            font-weight: 500;
        }

        .status-linha {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.8rem;
        }

        .status-conectado {
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-luz {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
        }

        .grade-botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .botao-controle {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: rgba(255,255,255,0.03);
            border: none;
            border-radius: 8px;
            padding: 10px 6px;
            color: white;
            cursor: pointer;
            transition: all 0.12s;
        }

        .botao-controle:hover { background: rgba(255,255,255,0.08); }
        .icone { font-size: 18px; }
        .rotulo { font-size: 0.6rem; color: #7888a0; }

        /* Estados de botão ativo/inativo */
        .botao-ativo {
            background: rgba(37, 99, 235, 0.35) !important;
            border: 1px solid rgba(96, 165, 250, 0.4) !important;
        }
        .botao-inativo {
            background: rgba(30, 41, 59, 0.6) !important;
            border: 1px solid transparent !important;
        }

        /* Barra de volume com ícone mudo em 0% */
        .bloco-volume {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 8px;
        }
        .volume-container {
            position: relative;
            display: flex;
            align-items: center;
            flex: 1;
        }
        .volume-mudo-icone {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 14px;
            color: #94a3b8;
        }
        .volume-zero .volume-mudo-icone {
            opacity: 1;
        }
        input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #334155;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            border: none;
        }

        /* ✅ Área de chat */
        .area-chat {
            margin-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .busca-chat {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .input-busca {
            flex: 1;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            padding: 4px 8px;
            color: white;
            font-size: 0.7rem;
            outline: none;
        }

        .input-busca:focus { border-color: rgba(59, 130, 246, 0.4); }

        .btn-limpar-busca {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 12px;
        }

        .mensagem-item {
            font-size: 0.75rem;
            color: #cbd5e1;
            padding: 6px 10px;
            background: rgba(255,255,255,0.02);
            border-radius: 6px;
            margin-bottom: 5px;
            line-height: 1.4;
        }

        .mensagem-item.sua {
            background: rgba(59, 130, 246, 0.12);
            color: #dbeafe;
            margin-left: 15%;
        }

        .mensagem-item.destaque-busca {
            background: rgba(234, 179, 8, 0.15);
            border-left: 2px solid #eab308;
        }

        .mensagem-item img {
            max-width: 260px;
            width: auto;
            height: auto;
            max-height: 150px;
            border-radius: 6px;
            margin-top: 6px;
            display: block;
            cursor: pointer;
            transition: all 0.25s ease;
            object-fit: contain;
        }

        .mensagem-item img:hover {
            transform: scale(1.02);
        }

        .mensagem-item img.ampliada {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90vw;
            max-height: 80vh;
            width: auto;
            height: auto;
            z-index: 10001;
            background: rgba(0,0,0,0.9);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 0 0 100vw rgba(0,0,0,0.7);
        }

        .entrada-chat {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            align-items: center;
        }

        .input-mensagem {
            flex: 1;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            padding: 7px 10px;
            color: white;
            font-size: 0.75rem;
            outline: none;
        }

        .input-mensagem:focus { border-color: rgba(59, 130, 246, 0.4); }

        .botao-anexo {
            background: rgba(255,255,255,0.05);
            border: none;
            border-radius: 6px;
            width: 32px;
            height: 32px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .botao-anexo:hover { background: rgba(255,255,255,0.1); color: white; }

        .botao-enviar {
            background: #2563eb;
            border: none;
            border-radius: 6px;
            padding: 7px 12px;
            color: white;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .botao-enviar:hover { background: #1d4ed8; }

        .input-arquivo { display: none; }

        .area-chat::-webkit-scrollbar { width: 4px; }
        .area-chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        .relogio-digital {
            font-size: 0.7rem;
            color: #64748b;
            text-align: right;
            margin-top: 6px;
        }

        /* 📋 Estilos para Status Suspenso e Contatos */
        .opcao-status:hover {
            background: rgba(255,255,255,0.05);
        }
        .item-contato {
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            transition: background 0.15s;
        }
        .item-contato:hover {
            background: rgba(255,255,255,0.04);
        }
        .nome-contato {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bolinha-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #475569;
        }
        .bolinha-online {
            background: #22c55e;
        }
        .estrela-favorito {
            color: #eab308;
            font-size: 10px;
            margin-left: 4px;
        }
    </style>
</head>
<body>

    <!-- 📞 TELA DE CHAMADA ENTRANTE -->
    <div class="tela-chamada-entrante" id="telaChamada">
        <div class="chamada-icone">📞</div>
        <div class="chamada-titulo">Chamada entrante</div>
        <div class="chamada-quem" id="quemEstaChamando">De: Amigo</div>
        <div class="chamada-botoes">
            <button class="btn-aceitar" id="btnAceitar">✅ Aceitar</button>
            <button class="btn-recusar" id="btnRecusar">❌ Recusar</button>
        </div>
    </div>

    <!-- 📺 TELA CHEIA — LIVE/CÂMERA -->
    <div class="tela-live-cheia" id="telaLive">
        <button class="btn-fechar-live" id="btnFecharLive">✕</button>
        <div class="live-conteudo">
            <img src="" alt="Live/Câmera" class="live-imagem" id="imagemLive">
        </div>
    </div>

    <!-- 📱 MENU DESLIZANTE DURANTE LIVE COM BOTÃO DE BUSCA -->
    <div class="menu-live-deslizante" id="menuLive">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="color: #94a3b8; font-size: 0.8rem;">Menu Rápido</span>
            <button style="background:none; border:none; color:#64748b; cursor:pointer; font-size:14px;" id="btnFecharMenuLive">✕</button>
        </div>
        
        <!-- 🔍 Botão que abre a busca -->
        <div style="padding: 0 0 10px 0; text-align: center;">
            <button id="btnAbrirBusca" style="
                background: rgba(255,255,255,0.03);
                border: 1px solid rgba(255,255,255,0.08);
                border-radius: 50%;
                width: 36px;
                height: 36px;
                color: #94a3b8;
                font-size: 16px;
                cursor: pointer;
                transition: all 0.2s;
            ">🔍</button>

            <!-- Caixa de busca — escondida no início -->
            <div id="caixaBusca" style="display: none; margin-top: 8px;">
                <input type="text" id="inputBuscaLive" placeholder="Digite para buscar..." style="
                    width: 100%;
                    background: rgba(255,255,255,0.03);
                    border: 1px solid rgba(255,255,255,0.08);
                    border-radius: 8px;
                    padding: 8px 12px;
                    color: white;
                    font-size: 0.8rem;
                    outline: none;
                ">
            </div>
        </div>

        <div class="menu-live-conteudo">
            <div class="item-menu-live" id="itemContatos">📇 Contatos</div>
            <div class="item-menu-live" id="itemChat">💬 Chat</div>
            <div class="item-menu-live" id="itemAudio">🎧 Áudio</div>
            <div class="item-menu-live" id="itemConfig">⚙️ Configurações</div>
            <div class="item-menu-live" id="itemFotoPerfil">👤 Perfil</div>
            <div class="item-menu-live" id="itemEncerrar">📹 Encerrar Live</div>
        </div>
    </div>

    <!-- 🟢 JANELA FLUTUANTE ARRASTÁVEL PRINCIPAL -->
    <div class="janela-flutuante" id="containerPrincipal">
        <div class="cabecalho-arrastavel">
            <div class="titulo-app">Guardian Shield</div>
            <div class="botao-perfil online" id="botaoPerfil">
                <span>👤</span>
                <div class="anel-notificacao" id="anelNotif"></div>
            </div>
        </div>

        <div class="menu-controles" id="menuControles">
            <button class="botao-fechar" id="botaoFechar">✕</button>
            
            <!-- 📞 FOTOS NA CHAMADA VOIP -->
            <div class="area-chamada-fotos" id="areaFotosChamada" style="display: none;">
                <div class="foto-chamada" id="fotoVoce">
                    <div class="foto-chamada-img">V</div>
                    <div class="foto-chamada-nome">Você</div>
                </div>
                <div class="foto-chamada" id="fotoEle">
                    <div class="foto-chamada-img">A</div>
                    <div class="foto-chamada-nome">Amigo</div>
                </div>
            </div>

            <!-- Status de conexão -->
            <div class="status-linha">
                <span>Você ↔ Amigo</span>
                <span class="status-conectado"><span class="status-luz"></span> Conectado</span>
            </div>

            <!-- ⬇️ MENU DE STATUS SUSPENSO -->
            <div class="status-linha" style="cursor: pointer;" id="btnAbrirStatus">
                <span>Seu status</span>
                <span id="textoStatus" style="display: flex; align-items: center; gap: 6px;">
                    <span style="width: 8px; height: 8px; border-radius: 50%; background: #22c55e;"></span>
                    Disponível
                </span>
            </div>

            <!-- 📋 MENU SUSPENSO DE STATUS -->
            <div id="menuStatus" style="
                position: absolute;
                top: 145px;
                right: 16px;
                background: rgba(15, 23, 42, 0.95);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255,255,255,0.08);
                border-radius: 10px;
                padding: 8px 0;
                box-shadow: 0 4px 20px rgba(0,0,0,0.3);
                z-index: 100;
                display: none;
                min-width: 160px;
            ">
                <div class="opcao-status" data-status="disponivel" style="padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.15s;">
                    <span style="width: 8px; height: 8px; border-radius: 50%; background: #22c55e;"></span>
                    Disponível
                </div>
                <div class="opcao-status" data-status="ausente" style="padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.15s;">
                    <span style="width: 8px; height: 8px; border-radius: 50%; background: #eab308;"></span>
                    Ausente
                </div>
                <div class="opcao-status" data-status="ocupado" style="padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.15s;">
                    <span style="width: 8px; height: 8px; border-radius: 50%; background: #ef4444;"></span>
                    Ocupado
                </div>
                <div class="opcao-status" data-status="silencio" style="padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.15s;">
                    <span style="width: 8px; height: 8px; border-radius: 50%; background: #6366f1;"></span>
                    Modo Silêncio
                </div>
            </div>

            <!-- Botões principais -->
            <div class="grade-botoes">
                <button class="botao-controle" id="btnContatos">
                    <span class="icone">📇</span>
                    <span class="rotulo">Contatos</span>
                </button>
                <button class="botao-controle botao-inativo" id="btnChat">
                    <span class="icone">💬</span>
                    <span class="rotulo">Chat</span>
                </button>
                <button class="botao-controle botao-inativo" id="btnMicrofone">
                    <span class="icone">🎤</span>
                    <span class="rotulo">Mudo</span>
                </button>
                <button class="botao-controle" id="btnTravar" data-acao="travar">
                    <span class="icone">🔒</span>
                    <span class="rotulo">Travar</span>
                </button>
                <button class="botao-controle" id="btnCamera">
                    <span class="icone">📷</span>
                    <span class="rotulo">Câmera</span>
                </button>
                <button class="botao-controle" id="btnTela">
                    <span class="icone">🖥️</span>
                    <span class="rotulo">Tela</span>
                </button>
                <button class="botao-controle" id="btnFoto">
                    <span class="icone">📸</span>
                    <span class="rotulo">Foto</span>
                </button>
                <button class="botao-controle" id="btnSair">
                    <span class="icone">📤</span>
                    <span class="rotulo">Sair</span>
                </button>
            </div>

            <!-- 📇 LISTA DE CONTATOS -->
            <div id="secaoContatos" style="display: none; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 10px;">
                <input type="text" id="buscaContatos" placeholder="🔍 Buscar contato..." style="
                    width: 100%;
                    background: rgba(255,255,255,0.03);
                    border: 1px solid rgba(255,255,255,0.08);
                    border-radius: 6px;
                    padding: 6px 10px;
                    color: white;
                    font-size: 0.75rem;
                    outline: none;
                    margin-bottom: 12px;
                ">

                <div style="font-size: 0.65rem; color: #eab308; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;">⭐ Favoritos</div>
                <div id="listaFavoritos" style="margin-bottom: 12px;"></div>

                <div style="font-size: 0.65rem; color: #22c55e; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;">● Online</div>
                <div id="listaOnline" style="margin-bottom: 12px;"></div>

                <div style="font-size: 0.65rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;">Todos os Contatos</div>
                <div id="listaTodos"></div>
            </div>

            <!-- Volume com ícone Mudo em 0% -->
            <div class="bloco-volume">
                <span style="font-size:12px; opacity:0.7;">🔊</span>
                <div class="volume-container" id="volumeContainer">
                    <input type="range" id="volumeAudio" min="0" max="100" value="75" style="margin:0 8px;">
                    <span class="volume-mudo-icone" id="iconeMudo">🔇</span>
                </div>
                <span style="font-size:12px; opacity:0.7;" id="valorVolume">75%</span>
            </div>

            <!-- Relógio digital -->
            <div class="relogio-digital" id="relogioDigital">00:00:00</div>

            <!-- Área de CHAT -->
            <div class="area-chat" id="areaChat">
                <div class="busca-chat">
                    <input type="text" class="input-busca" id="inputBusca" placeholder="🔍 Buscar palavra...">
                    <button class="btn-limpar-busca" id="btnLimparBusca">✕</button>
                </div>
                <div id="listaMensagens"></div>
                <div class="entrada-chat">
                    <label class="botao-anexo" title="Anexar imagem">
                        📎
                        <input type="file" id="inputArquivo" accept="image/*" class="input-arquivo">
                    </label>
                    <input type="text" class="input-mensagem" id="inputMensagem" placeholder="Digite sua mensagem...">
                    <button class="botao-enviar" id="botaoEnviar">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🕐 RELÓGIO DIGITAL
        // ==========================================
        const relogio = document.getElementById('relogioDigital');
        function atualizarRelogio() {
            const agora = new Date();
            relogio.textContent = agora.toLocaleTimeString('pt-BR', { hour12: false });
        }
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();

        // ==========================================
        // 📞 TELA DE CHAMADA E CONTROLES DE INTERFACE
        // ==========================================
        const telaChamada = document.getElementById('telaChamada');
        const btnAceitar = document.getElementById('btnAceitar');
        const btnRecusar = document.getElementById('btnRecusar');
        const containerPrincipal = document.getElementById('containerPrincipal');
        const botaoPerfil = document.getElementById('botaoPerfil');
        const botaofecharMenu = document.getElementById('botaoFechar');
        const anelNotif = document.getElementById('anelNotif');
        const areaFotosChamada = document.getElementById('areaFotosChamada');
        const fotoVoce = document.getElementById('fotoVoce');
        const fotoEle = document.getElementById('fotoEle');

        let menuAberto = false;
        let emChamada = false;

        btnAceitar.addEventListener('click', () => {
            telaChamada.classList.add('aceitando');
            setTimeout(() => {
                telaChamada.classList.remove('ativa', 'aceitando');
                containerPrincipal.classList.add('visivel');
                menuAberto = true;
                containerPrincipal.classList.add('aberto');
                emChamada = true;
                areaFotosChamada.style.display = 'flex';
                fotoVoce.classList.add('falando');
            }, 500);
        });

        btnRecusar.addEventListener('click', () => {
            telaChamada.classList.remove('ativa');
        });

        botaoPerfil.addEventListener('click', () => {
            menuAberto = !menuAberto;
            containerPrincipal.classList.toggle('aberto', menuAberto);
            if (!menuAberto) limparNotificacao();
        });

        botaofecharMenu.addEventListener('click', () => {
            menuAberto = false;
            containerPrincipal.classList.remove('aberto');
        });

        function novaNotificacao() {
            anelNotif.classList.remove('piscando');
            void anelNotif.offsetWidth;
            anelNotif.classList.add('piscando');
        }

        function limparNotificacao() {
            anelNotif.classList.remove('piscando');
        }

        // ==========================================
        // 🔊 BARRA DE VOLUME — MOSTRAR MUDO EM 0%
        // ==========================================
        const volumeEl = document.getElementById('volumeAudio');
        const volumeContainer = document.getElementById('volumeContainer');
        const valorVolume = document.getElementById('valorVolume');
        
        function atualizarIconeVolume() {
            if (!volumeEl || !volumeContainer) return;
            const val = parseInt(volumeEl.value);
            valorVolume.textContent = val + '%';
            if (val === 0) {
                volumeContainer.classList.add('volume-zero');
            } else {
                volumeContainer.classList.remove('volume-zero');
            }
        }
        
        if (volumeEl) {
            volumeEl.addEventListener('input', atualizarIconeVolume);
            atualizarIconeVolume();
        }

        // ==========================================
        // 🪟 JANELA FLUTUANTE — ARRASTAR + TRAVAR
        // ==========================================
        const janela = document.querySelector('.janela-flutuante');
        const btnTravar = document.querySelector('[data-acao="travar"]');
        let janelaTravada = false;
        let arrastando = false;
        let deslocamentoX = 0, deslocamentoY = 0;

        function alternarTravarJanela() {
            janelaTravada = !janelaTravada;
            if (janelaTravada) {
                janela.classList.add('travada');
                if (btnTravar) btnTravar.querySelector('.icone').textContent = '🔓';
            } else {
                janela.classList.remove('travada');
                if (btnTravar) btnTravar.querySelector('.icone').textContent = '🔒';
            }
        }

        function iniciarArrasto(e) {
            if (janelaTravada) return;
            arrastando = true;
            const rect = janela.getBoundingClientRect();
            const clienteX = e.clientX || e.touches[0].clientX;
            const clienteY = e.clientY || e.touches[0].clientY;
            deslocamentoX = clienteX - rect.left;
            deslocamentoY = clienteY - rect.top;
            janela.style.transition = 'none';
        }

        function arrastar(e) {
            if (!arrastando || janelaTravada) return;
            e.preventDefault();
            const clienteX = e.clientX || e.touches[0].clientX;
            const clienteY = e.clientY || e.touches[0].clientY;
            
            let novaEsq = clienteX - deslocamentoX;
            let novaTop = clienteY - deslocamentoY;
            
            const larguraJanela = janela.offsetWidth;
            const alturaJanela = janela.offsetHeight;
            const limiteDireita = window.innerWidth - larguraJanela;
            const limiteInferior = window.innerHeight - alturaJanela;
            
            novaEsq = Math.max(0, Math.min(novaEsq, limiteDireita));
            novaTop = Math.max(0, Math.min(novaTop, limiteInferior));
            
            janela.style.left = novaEsq + 'px';
            janela.style.top = novaTop + 'px';
            janela.style.bottom = 'auto';
            janela.style.right = 'auto';
        }

        function pararArrasto() {
            arrastando = false;
        }

        if (btnTravar) btnTravar.addEventListener('click', alternarTravarJanela);
        const cabecalho = janela?.querySelector('.cabecalho-arrastavel') || janela;
        cabecalho?.addEventListener('mousedown', iniciarArrasto);
        document.addEventListener('mousemove', arrastar);
        document.addEventListener('mouseup', pararArrasto);
        cabecalho?.addEventListener('touchstart', iniciarArrasto);
        document.addEventListener('touchmove', arrastar, { passive: false });
        document.addEventListener('touchend', pararArrasto);

        // ==========================================
        // 📋 MENU DE STATUS SUSPENSO
        // ==========================================
        const btnAbrirStatus = document.getElementById('btnAbrirStatus');
        const menuStatus = document.getElementById('menuStatus');
        const textoStatus = document.getElementById('textoStatus');
        const opcoesStatus = document.querySelectorAll('.opcao-status');
        let menuStatusAberto = false;

        btnAbrirStatus.addEventListener('click', (e) => {
            e.stopPropagation();
            menuStatusAberto = !menuStatusAberto;
            menuStatus.style.display = menuStatusAberto ? 'block' : 'none';
        });

        document.addEventListener('click', (e) => {
            if (!btnAbrirStatus.contains(e.target) && !menuStatus.contains(e.target)) {
                menuStatusAberto = false;
                menuStatus.style.display = 'none';
            }
        });

        opcoesStatus.forEach(opcao => {
            opcao.addEventListener('click', () => {
                const cor = opcao.querySelector('span').style.background;
                const nome = opcao.textContent.trim();
                textoStatus.innerHTML = `<span style="width: 8px; height: 8px; border-radius: 50%; background: ${cor};"></span> ${nome}`;
                menuStatus.style.display = 'none';
                menuStatusAberto = false;
            });
        });

        // ==========================================
        // 📇 LISTA DE CONTATOS
        // ==========================================
        const secaoContatos = document.getElementById('secaoContatos');
        const listaFavoritos = document.getElementById('listaFavoritos');
        const listaOnline = document.getElementById('listaOnline');
        const listaTodos = document.getElementById('listaTodos');
        const buscaContatos = document.getElementById('buscaContatos');
        const btnContatos = document.getElementById('btnContatos');

        const contatos = [
            { id: 1, nome: 'Ana Silva', favorito: true, online: true },
            { id: 2, nome: 'Beatriz Costa', favorito: false, online: true },
            { id: 3, nome: 'Carlos Mendes', favorito: true, online: false },
            { id: 4, nome: 'Fernanda Lima', favorito: false, online: true },
            { id: 5, nome: 'Mariana Souza', favorito: false, online: false },
            { id: 6, nome: 'Rafael Gomes', favorito: false, online: false },
        ];

        function renderizarContatos(filtro = '') {
            const termo = filtro.toLowerCase();
            const filtrados = contatos.filter(c => c.nome.toLowerCase().includes(termo));

            const favoritos = filtrados.filter(c => c.favorito).sort((a, b) => a.nome.localeCompare(b.nome));
            const online = filtrados.filter(c => !c.favorito && c.online).sort((a, b) => a.nome.localeCompare(b.nome));
            const todos = filtrados.sort((a, b) => a.nome.localeCompare(b.nome));

            listaFavoritos.innerHTML = favoritos.length ? favoritos.map(c => criarItem(c)).join('') : '<div style="font-size:0.7rem; color:#475569; padding:4px 8px;">Nenhum favorito</div>';
            listaOnline.innerHTML = online.length ? online.map(c => criarItem(c)).join('') : '<div style="font-size:0.7rem; color:#475569; padding:4px 8px;">Ninguém online</div>';
            listaTodos.innerHTML = todos.length ? todos.map(c => criarItem(c)).join('') : '<div style="font-size:0.7rem; color:#475569; padding:4px 8px;">Nenhum contato</div>';
        }

        function criarItem(contato) {
            return `
                <div class="item-contato" data-id="${contato.id}">
                    <div class="nome-contato">
                        <span class="bolinha-status ${contato.online ? 'bolinha-online' : ''}"></span>
                        <span>${contato.nome}</span>
                        ${contato.favorito ? '<span class="estrela-favorito">★</span>' : ''}
                    </div>
                </div>
            `;
        }

        btnContatos.addEventListener('click', () => {
            const aberto = secaoContatos.style.display === 'block';
            secaoContatos.style.display = aberto ? 'none' : 'block';
            if (!aberto) renderizarContatos();
        });

        buscaContatos.addEventListener('input', () => {
            renderizarContatos(buscaContatos.value);
        });

        // ==========================================
        // 📺 LIVE EM TELA CHEIA & MENU DESLIZANTE
        // ==========================================
        const telaLive = document.getElementById('telaLive');
        const btnFecharLive = document.getElementById('btnFecharLive');
        const btnCamera = document.getElementById('btnCamera');
        const btnTela = document.getElementById('btnTela');
        const menuLive = document.getElementById('menuLive');
        const btnFecharMenuLive = document.getElementById('btnFecharMenuLive');

        btnCamera.addEventListener('click', () => {
            telaLive.classList.add('ativa');
            menuLive.classList.add('visivel');
        });

        btnTela.addEventListener('click', () => {
            telaLive.classList.add('ativa');
            menuLive.classList.add('visivel');
        });

        btnFecharLive.addEventListener('click', () => {
            telaLive.classList.remove('ativa');
            menuLive.classList.remove('visivel');
        });

        btnFecharMenuLive.addEventListener('click', () => {
            menuLive.classList.remove('visivel');
        });

        document.getElementById('itemContatos').addEventListener('click', () => {
            menuLive.classList.remove('visivel');
            botaoPerfil.click();
            setTimeout(() => { if(secaoContatos.style.display !== 'block') btnContatos.click(); }, 150);
        });
        document.getElementById('itemChat').addEventListener('click', () => {
            menuLive.classList.remove('visivel');
            botaoPerfil.click();
            setTimeout(() => btnChat.click(), 100);
        });
        document.getElementById('itemAudio').addEventListener('click', () => { menuLive.classList.remove('visivel'); });
        document.getElementById('itemConfig').addEventListener('click', () => { menuLive.classList.remove('visivel'); });
        document.getElementById('itemFotoPerfil').addEventListener('click', () => { menuLive.classList.remove('visivel'); });
        document.getElementById('itemEncerrar').addEventListener('click', () => {
            telaLive.classList.remove('ativa');
            menuLive.classList.remove('visivel');
        });

        // ==========================================
        // 🔍 BUSCA — Abre ao clicar no ícone
        // ==========================================
        const btnAbrirBusca = document.getElementById('btnAbrirBusca');
        const caixaBusca = document.getElementById('caixaBusca');
        const inputBuscaLive = document.getElementById('inputBuscaLive');
        let buscaVisivel = false;

        btnAbrirBusca.addEventListener('click', () => {
            buscaVisivel = !buscaVisivel;
            caixaBusca.style.display = buscaVisivel ? 'block' : 'none';
            btnAbrirBusca.style.background = buscaVisivel ? 'rgba(59, 130, 246, 0.15)' : 'rgba(255,255,255,0.03)';
            btnAbrirBusca.style.borderColor = buscaVisivel ? 'rgba(59, 130, 246, 0.3)' : 'rgba(255,255,255,0.08)';
            if (buscaVisivel) inputBuscaLive.focus();
        });

        // ==========================================
        // 🎤 BOTÕES DE CONTROLE & CHAT
        // ==========================================
        const btnChat = document.getElementById('btnChat');
        const btnMicrofone = document.getElementById('btnMicrofone');
        const btnSair = document.getElementById('btnSair');
        const areaChat = document.getElementById('areaChat');
        const listaMensagens = document.getElementById('listaMensagens');
        const inputMensagem = document.getElementById('inputMensagem');
        const botaoEnviar = document.getElementById('botaoEnviar');
        const inputArquivo = document.getElementById('inputArquivo');
        const inputBusca = document.getElementById('inputBusca');
        const btnLimparBusca = document.getElementById('btnLimparBusca');

        let chatVisivel = false;
        let mudo = false;
        let falandoSouEu = true;

        btnMicrofone.addEventListener('click', () => {
            mudo = !mudo;
            btnMicrofone.classList.toggle('ativo', mudo);
            btnMicrofone.classList.toggle('botao-ativo', mudo);
            btnMicrofone.classList.toggle('botao-inativo', !mudo);
            btnMicrofone.querySelector('.icone').textContent = mudo ? '🔇' : '🎤';
        });

        btnChat.addEventListener('click', () => {
            chatVisivel = !chatVisivel;
            areaChat.style.display = chatVisivel ? 'block' : 'none';
            btnChat.classList.toggle('ativo', chatVisivel);
            btnChat.classList.toggle('botao-ativo', chatVisivel);
            btnChat.classList.toggle('botao-inativo', !chatVisivel);
            if (chatVisivel) limparNotificacao();
            else inputBusca.value = '';
            limparDestaquesBusca();
        });

        btnSair.addEventListener('click', () => {
            if (confirm('Sair da chamada?')) {
                containerPrincipal.classList.remove('visivel', 'aberto');
                menuAberto = false;
                emChamada = false;
                areaFotosChamada.style.display = 'none';
                telaLive.classList.remove('ativa');
                menuLive.classList.remove('visivel');
            }
        });

        function adicionarMensagemNaTela(textoOuHtml, sua = false, ehHtml = false) {
            const msg = document.createElement('div');
            msg.className = `mensagem-item ${sua ? 'sua' : ''}`;
            if (ehHtml) msg.innerHTML = textoOuHtml;
            else msg.textContent = textoOuHtml;
            listaMensagens.appendChild(msg);
            areaChat.scrollTop = areaChat.scrollHeight;

            salvarMensagem(textoOuHtml, sua, ehHtml);
        }

        botaoEnviar.addEventListener('click', () => {
            const texto = inputMensagem.value.trim();
            if (texto) {
                adicionarMensagemNaTela(texto, true, false);
                inputMensagem.value = '';
                setTimeout(() => {
                    adicionarMensagemNaTela('Mensagem recebida! 👋', false, false);
                    novaNotificacao();
                }, 800);
            }
        });

        inputMensagem.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') botaoEnviar.click();
        });

        inputArquivo.addEventListener('change', (e) => {
            const arquivo = e.target.files[0];
            if (arquivo) {
                const leitor = new FileReader();
                leitor.onload = function(event) {
                    const htmlImg = `
                        <span style="font-size:0.65rem; color:#94a3b8;">📸 Imagem enviada</span>
                        <img src="${event.target.result}" alt="Imagem" onclick="this.classList.toggle('ampliada')">
                    `;
                    adicionarMensagemNaTela(htmlImg, true, true);
                };
                leitor.readAsDataURL(arquivo);
            }
        });

        document.addEventListener('paste', function (e) {
            if (!chatVisivel) return;
            const itens = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of itens) {
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    const arquivo = item.getAsFile();
                    if (!arquivo) return;
                    const leitor = new FileReader();
                    leitor.onload = function (event) {
                        const htmlImg = `
                            <span style="font-size:0.65rem; color:#94a3b8;">📸 Colada</span>
                            <img src="${event.target.result}" alt="Imagem colada" onclick="this.classList.toggle('ampliada')">
                        `;
                        adicionarMensagemNaTela(htmlImg, true, true);
                    };
                    leitor.readAsDataURL(arquivo);
                    e.preventDefault();
                    return;
                }
            }
        });

        function limparDestaquesBusca() {
            document.querySelectorAll('.mensagem-item.destaque-busca').forEach(m => {
                m.classList.remove('destaque-busca');
            });
        }

        inputBusca.addEventListener('input', () => {
            const termo = inputBusca.value.trim().toLowerCase();
            limparDestaquesBusca();
            if (!termo) return;
            
            const mensagens = document.querySelectorAll('.mensagem-item');
            mensagens.forEach(msg => {
                if (msg.textContent.toLowerCase().includes(termo)) {
                    msg.classList.add('destaque-busca');
                }
            });
        });

        btnLimparBusca.addEventListener('click', () => {
            inputBusca.value = '';
            limparDestaquesBusca();
        });

        setInterval(() => {
            if (!emChamada) return;
            falandoSouEu = !falandoSouEu;
            fotoVoce.classList.toggle('falando', falandoSouEu);
            fotoEle.classList.toggle('falando', !falandoSouEu);
        }, 4000);

        setTimeout(() => {
            telaChamada.classList.add('ativa');
            novaNotificacao();
        }, 2000);

        // ==========================================
        // 💾 SALVAR E CARREGAR HISTÓRICO AUTOMÁTICO
        // ==========================================
        const CHAVE_HISTORICO = 'guardian_shield_historico';

        function carregarHistorico() {
            const salvo = localStorage.getItem(CHAVE_HISTORICO);
            if (salvo) {
                const mensagens = JSON.parse(salvo);
                mensagens.forEach(msg => {
                    const m = document.createElement('div');
                    m.className = `mensagem-item ${msg.sua ? 'sua' : ''}`;
                    if (msg.ehHtml) m.innerHTML = msg.texto;
                    else m.textContent = msg.texto;
                    listaMensagens.appendChild(m);
                });
                areaChat.scrollTop = areaChat.scrollHeight;
            }
        }

        function salvarMensagem(texto, sua = false, ehHtml = false) {
            const mensagens = JSON.parse(localStorage.getItem(CHAVE_HISTORICO) || '[]');
            mensagens.push({ texto, sua, ehHtml, data: new Date().toISOString() });
            localStorage.setItem(CHAVE_HISTORICO, JSON.stringify(mensagens));
        }

        document.addEventListener('DOMContentLoaded', carregarHistorico);

        console.log('%c✨ Guardian Shield Completo carregado com sucesso!', 'color: #10b981; font-weight: bold;');
    </script>
</body>
</html>
